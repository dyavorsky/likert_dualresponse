on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

# One publish at a time. Every run checks out gh-pages into a worktree and
# pushes to it, so two overlapping runs race and one is rejected as
# non-fast-forward. Queue them instead, and drop superseded runs.
concurrency:
  group: quarto-publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release
          tinytex: true

      # index.qmd includes sections/simstudy.qmd and sections/appendix.qmd,
      # which gained {r} chunks in 5e7b94e (2026-07-28). They only call
      # knitr::kable and knitr::include_graphics on the pre-computed .rds
      # files tracked in R/output/, so base R plus knitr is enough -- but
      # without an R installation the render dies with "Failed to spawn
      # 'Rscript'", which is what broke publishing from 2026-07-29 onward.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr and rmarkdown
        run: install.packages(c("knitr", "rmarkdown"))
        shell: Rscript {0}

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
